# Weekly: turn other players' anonymous reports into recipe changes, as a pull request for a person
# to review. Scripts/community-recipes.py only changes the renderer, the untested status and one
# "Community reports" note, with the same thresholds the app uses (CommunityAdvice).
name: Community recipes

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: community-recipes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update recipes from community reports
        run: python3 Scripts/community-recipes.py --summary "$RUNNER_TEMP/summary.md"

      - name: Test the community recipe script
        # The import-recipes tests build GamePort with Swift, which needs a Mac.
        run: python3 -m unittest discover -s Tests/ScriptTests -p "test_community_recipes.py"

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No recipe changes this week."
            exit 0
          fi
          branch="community-recipes/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "Recipes: update from community reports"
          git push -f origin "$branch"
          {
            echo "Other players' anonymous reports now say this about these games (at least 3 Macs, 80% working; never D3DMetal, never verified recipes):"
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Generated by \`Scripts/community-recipes.py\`. Check each change before merging."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$branch" --title "Recipes from community reports ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/body.md"
          fi
